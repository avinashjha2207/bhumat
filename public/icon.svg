<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="beaconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="contourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="beaconGlowHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes beaconHeartbeat {
      0% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      100% { transform: scale(0.92); opacity: 0.85; }
    }
    @keyframes waveRipple {
      0% { r: 18px; opacity: 0.9; stroke-width: 2.2px; }
      100% { r: 42px; opacity: 0; stroke-width: 0.5px; }
    }
    .radar-orbit-spin {
      transform-origin: 64px 64px;
      animation: radarSpin 14s linear infinite;
    }
    .beacon-pulse-core {
      transform-origin: 64px 64px;
      animation: beaconHeartbeat 2.2s ease-in-out infinite;
    }
    .ripple-wave-ping {
      animation: waveRipple 2.6s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
  </style>

  <!-- Container Squircle Badge with Metallic Dark Navy Border -->
  <rect width="128" height="128" rx="28" fill="url(#beaconBgGrad)" stroke="#1e293b" stroke-width="2.5" />
  <rect x="2.5" y="2.5" width="123" height="123" rx="26" fill="none" stroke="#0ea5e9" stroke-width="0.7" opacity="0.35" />

  <!-- Background Crosshair Reticle -->
  <g stroke="#38bdf8" stroke-width="0.9" opacity="0.2" stroke-dasharray="2,3">
    <line x1="64" y1="14" x2="64" y2="114" />
    <line x1="14" y1="64" x2="114" y2="64" />
  </g>

  <!-- Outer Spinning Radar Orbit -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" />
  <g class="radar-orbit-spin">
    <circle cx="64" cy="64" r="42" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="8,6" opacity="0.75" />
    <circle cx="106" cy="64" r="2.2" fill="#38bdf8" />
    <circle cx="22" cy="64" r="2.2" fill="#38bdf8" />
  </g>

  <!-- Middle Concentric Ring & Ripple Ping -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#0ea5e9" stroke-width="1.6" opacity="0.55" />
  <circle cx="64" cy="64" class="ripple-wave-ping" fill="none" stroke="#10b981" />

  <!-- Inner Telemetry Orbit -->
  <circle cx="64" cy="64" r="18" fill="none" stroke="#10b981" stroke-width="2.2" opacity="0.85" />

  <!-- Bharat Spatial Needle Silhouette -->
  <path d="M 64 24
           C 68 28, 73 30, 77 34
           C 85 40, 89 48, 86 58
           C 83 68, 74 84, 64 102
           C 54 84, 45 68, 42 58
           C 39 48, 43 40, 51 34
           C 55 30, 60 28, 64 24 Z" fill="url(#contourGrad)" fill-opacity="0.14" stroke="url(#contourGrad)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Radial Glow Halo behind Center -->
  <circle cx="64" cy="64" r="16" fill="url(#beaconGlowHalo)" />

  <!-- Pulsing Central Beacon (The Sovereign Vote) -->
  <g class="beacon-pulse-core">
    <circle cx="64" cy="64" r="8" fill="#10b981" filter="url(#neonBlur)" />
    <circle cx="64" cy="64" r="3.6" fill="#ffffff" />
  </g>

  <!-- Saffron & Emerald Cardinal Anchors -->
  <circle cx="64" cy="24" r="3.2" fill="#f97316" />
  <circle cx="64" cy="24" r="1.2" fill="#ffffff" />
  <circle cx="64" cy="102" r="3.2" fill="#10b981" />
  <circle cx="64" cy="102" r="1.2" fill="#ffffff" />
</svg>